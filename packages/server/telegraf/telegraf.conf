[agent]
	interval = "10s"
	flush_interval = "10s"
	omit_hostname = true

[[inputs.mqtt_consumer]]
	servers = ["tcp://broker.emqx.io:1883"]
	topics = ["sunrise-clock/+/telemetry"]
	qos = 0
	client_id = "telegraf-sunrise-clock-67291c51"
	
	name_override = "sunrise_clock_telemetry"
	topic_tag = ""

	data_format = "json"
	tag_keys = ["deviceId"]
	json_string_fields = ["firmwareVersion", "lightMode", "screen"]

[[outputs.file]]
	files = ["stdout"]
	data_format = "influx"

[[outputs.influxdb_v2]]
	urls = ["${INFLUX_URL}"]
	token = "${INFLUX_TOKEN}"
	organization = "${INFLUX_ORG}"
	bucket = "${INFLUX_BUCKET}"
